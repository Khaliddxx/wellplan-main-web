<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The three reports: Performance, Insights and Achievements.">
  <defs>
    <style>
      .t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .num{font-size:14px;font-weight:800;fill:#0D0D0F}
      .h{font-size:26px;font-weight:700;fill:#FFFFFF}
      .b{font-size:17px;fill:#9CA3AF}
      .k{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;fill:#6B8EFF}
    </style>
  </defs>

  <rect width="1200" height="460" fill="#0D0D0F"/>
  <text class="t k" x="60" y="50">What you get once an account is connected</text>

  <!-- Performance -->
  <g>
    <rect x="60" y="78" width="345" height="330" rx="20" fill="#131318" stroke="#26262C" stroke-width="2"/>
    <circle cx="98" cy="120" r="17" fill="#214CE5"/>
    <text class="t num" x="93" y="126">1</text>
    <text class="t h" x="128" y="128">Performance</text>
    <text class="t b" x="92" y="176">Clicks, impressions and</text>
    <text class="t b" x="92" y="202">more, filtered by post</text>
    <text class="t b" x="92" y="228">and by query. Exportable.</text>
    <g transform="translate(92,258)">
      <rect x="0" y="0" width="282" height="34" rx="9" fill="#1B1B22"/>
      <text class="t" x="14" y="23" font-size="15" fill="#D1D5DB">are solar panels worth it</text>
      <text class="t" x="248" y="23" font-size="15" font-weight="700" fill="#6B8EFF">1,204</text>
      <rect x="0" y="44" width="282" height="34" rx="9" fill="#1B1B22"/>
      <text class="t" x="14" y="67" font-size="15" fill="#D1D5DB">best installer near me</text>
      <text class="t" x="256" y="67" font-size="15" font-weight="700" fill="#6B8EFF">880</text>
      <rect x="0" y="88" width="282" height="34" rx="9" fill="#1B1B22"/>
      <text class="t" x="14" y="111" font-size="15" fill="#D1D5DB">solar payback time</text>
      <text class="t" x="256" y="111" font-size="15" font-weight="700" fill="#6B8EFF">417</text>
    </g>
  </g>

  <!-- Insights -->
  <g>
    <rect x="428" y="78" width="345" height="330" rx="20" fill="#131318" stroke="#26262C" stroke-width="2"/>
    <circle cx="466" cy="120" r="17" fill="#214CE5"/>
    <text class="t num" x="461" y="126">2</text>
    <text class="t h" x="496" y="128">Insights</text>
    <text class="t b" x="460" y="176">Recent trends, your top</text>
    <text class="t b" x="460" y="202">posts, and how people</text>
    <text class="t b" x="460" y="228">are finding your account.</text>
    <g transform="translate(460,262)">
      <rect x="0" y="0" width="282" height="118" rx="12" fill="#1B1B22"/>
      <polyline points="22,96 68,86 114,66 160,70 206,40 252,16"
                fill="none" stroke="#214CE5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="252" cy="16" r="7" fill="#6B8EFF"/>
      <text class="t" x="22" y="112" font-size="12" fill="#6B7280">28 days</text>
    </g>
  </g>

  <!-- Achievements -->
  <g>
    <rect x="796" y="78" width="344" height="330" rx="20" fill="#131318" stroke="#26262C" stroke-width="2"/>
    <circle cx="834" cy="120" r="17" fill="#214CE5"/>
    <text class="t num" x="829" y="126">3</text>
    <text class="t h" x="864" y="128">Achievements</text>
    <text class="t b" x="828" y="176">Milestones, such as</text>
    <text class="t b" x="828" y="202">passing a new click</text>
    <text class="t b" x="828" y="228">threshold in 28 days.</text>
    <g transform="translate(828,258)">
      <rect x="0" y="0" width="282" height="122" rx="12" fill="#1B1B22"/>
      <path d="M141 26a26 26 0 0 1 26 26v14a26 26 0 0 1-52 0V52a26 26 0 0 1 26-26z" fill="#214CE5"/>
      <path d="M115 40h-16a20 20 0 0 0 20 20M167 40h16a20 20 0 0 1-20 20" fill="none" stroke="#6B8EFF" stroke-width="4" stroke-linecap="round"/>
      <rect x="126" y="94" width="30" height="9" rx="4" fill="#6B8EFF"/>
      <text class="t" x="141" y="86" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1K</text>
    </g>
  </g>
</svg>
